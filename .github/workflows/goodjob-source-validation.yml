name: Validate pinned GoodJob upstream

on:
  push:
    branches:
      - migration/goodjob-cloudflare-supabase
    paths:
      - "docs/migration/**"
      - ".github/workflows/goodjob-source-validation.yml"
      - "scripts/migration/**"
      - "tests/migration/**"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "docs/migration/**"
      - ".github/workflows/goodjob-source-validation.yml"
      - "scripts/migration/**"
      - "tests/migration/**"

permissions:
  contents: read

concurrency:
  group: goodjob-source-validation-${{ github.ref }}
  # Do not cancel an expensive baseline run merely because a documentation commit lands.
  cancel-in-progress: false

jobs:
  validate-upstream:
    name: Build and test upstream at pinned SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Hephaestus migration branch
        uses: actions/checkout@v4

      - name: Check out pinned GoodJob source
        uses: actions/checkout@v4
        with:
          repository: huangguojia/GoodJob
          ref: 30928c297646597fd7d52ee15ca93236bf0bd2e5
          path: goodjob-source

      - name: Apply reviewed CLI warm lifecycle guard in temporary checkout
        run: python scripts/migration/apply_cli_warm_lifecycle_patch.py

      - name: Inventory pinned MySQL schema
        run: |
          python scripts/migration/inventory_mysql_schema.py goodjob-source/backend/schema.mysql.sql --output migration-artifacts/mysql-schema-inventory.json
          python scripts/migration/audit_mysql_dialect.py goodjob-source --output migration-artifacts/mysql-dialect-audit.json
          python -m unittest discover -s tests/migration -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: goodjob-source/package-lock.json

      - name: Record source revision and toolchain
        working-directory: goodjob-source
        run: |
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install root workspace dependencies
        id: install-root
        working-directory: goodjob-source
        run: npm ci --ignore-scripts=false

      - name: Install standalone WhatsApp plugin dependencies
        id: install-whatsapp
        working-directory: goodjob-source/whatsapp-plugin
        run: npm ci --ignore-scripts=false

      - name: Capture dependency audit reports
        if: always() && steps.install-root.conclusion == 'success' && steps.install-whatsapp.conclusion == 'success'
        working-directory: goodjob-source
        run: |
          mkdir -p ../migration-artifacts
          npm audit --json > ../migration-artifacts/npm-audit-root.json || echo "Root npm audit reported findings; JSON report retained."
          npm --prefix whatsapp-plugin audit --json > ../migration-artifacts/npm-audit-whatsapp.json || echo "WhatsApp npm audit reported findings; JSON report retained."

      - name: Capture dependency SBOM reports
        if: always() && steps.install-root.conclusion == 'success' && steps.install-whatsapp.conclusion == 'success'
        working-directory: goodjob-source
        run: |
          mkdir -p ../migration-artifacts
          npm sbom --sbom-format=cyclonedx --omit=optional > ../migration-artifacts/sbom-root.cdx.json || echo "Root SBOM generation failed; inspect job logs."
          npm --prefix whatsapp-plugin sbom --sbom-format=cyclonedx --omit=optional > ../migration-artifacts/sbom-whatsapp.cdx.json || echo "WhatsApp SBOM generation failed; inspect job logs."

      - name: Validate dependency audit and SBOM artifacts
        if: always() && steps.install-root.conclusion == 'success' && steps.install-whatsapp.conclusion == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("migration-artifacts")
          required = [
              "npm-audit-root.json",
              "npm-audit-whatsapp.json",
              "sbom-root.cdx.json",
              "sbom-whatsapp.cdx.json",
          ]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit(f"Required dependency evidence missing or empty: {', '.join(missing)}")
          for name in required:
              path = root / name
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"{name} is not valid JSON: {exc}")
              if name.startswith("sbom-") and not isinstance(data.get("components"), list):
                  raise SystemExit(f"{name} is missing CycloneDX components array")
              print(f"Validated {name}: {path.stat().st_size} bytes")
          PY

      - name: Build all upstream packages
        id: build
        working-directory: goodjob-source
        run: npm run build

      - name: Run upstream test suite even if build fails
        id: test
        if: always() && steps.install-root.conclusion == 'success' && steps.install-whatsapp.conclusion == 'success'
        working-directory: goodjob-source
        run: npm test

      - name: Re-run failed WhatsApp CLI warm test in isolation
        if: always() && steps.install-whatsapp.conclusion == 'success' && steps.test.conclusion == 'failure'
        working-directory: goodjob-source/whatsapp-plugin
        run: npm test -- tests/cli-warm.test.ts

      - name: Upload test/build logs if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodjob-validation-metadata
          path: |
            goodjob-source/npm-debug.log
            goodjob-source/**/npm-debug.log
            migration-artifacts/mysql-schema-inventory.json
            migration-artifacts/mysql-dialect-audit.json
            migration-artifacts/npm-audit-root.json
            migration-artifacts/npm-audit-whatsapp.json
            migration-artifacts/sbom-root.cdx.json
            migration-artifacts/sbom-whatsapp.cdx.json
          if-no-files-found: ignore
          retention-days: 7
